# Self-test for .github/actions/report-ci-failure.
#
# This run is RED BY DESIGN: the "Simulated failure" step always fails, and the
# report step then creates (or comments on) a REAL IGDD Jira ticket. The person who
# runs it closes that ticket afterwards.
#
# Expected summary: "IZG CI failure: <component> - Test report-ci-failure - Simulated failure"
# Run it twice with the same input to check repeat detection: the second run should
# add a comment to the first ticket rather than open a new one. Wait at least a
# minute between runs, because Jira's search index can lag a newly created ticket.
#
# workflow_dispatch only works for workflow files on the default branch (main),
# so this can only be run after it has been merged.

name: Test report-ci-failure

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to report against
        type: choice
        options:
          - BOM
          - Configuration Console
          - Transformation Console
        default: BOM
  # TEMPORARY (IGDD-2768): lets the self-test run from this branch before it is on main.
  # Revert this commit before opening the PR.
  push:
    branches: [IGDD-2768]
    paths:
      - .github/workflows/test-report-ci-failure.yml
      - .github/actions/report-ci-failure/**

permissions:
  contents: read
  actions: read

jobs:
  self-test:
    name: Simulate a failure and report it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Simulated failure
        run: exit 1

      # No reason input, so failed-step detection is exercised.
      - name: Report failure to Jira
        if: failure()
        uses: ./.github/actions/report-ci-failure
        with:
          component: ${{ inputs.component || 'BOM' }}
          jira-api-url: ${{ secrets.JIRA_API_URL }}
          jira-auth: ${{ secrets.JIRA_API_AUTH_BASE64 }}
